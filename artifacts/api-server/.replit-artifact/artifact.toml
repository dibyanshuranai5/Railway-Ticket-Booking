kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "mvn -f ../../backend/pom.xml spring-boot:run"

[services.production.build]
args = ["mvn", "-f", "../../backend/pom.xml", "-DskipTests", "package"]

[services.production.run]
args = ["java", "-jar", "../../backend/target/train-booking-api.jar"]

[services.production.run.env]
PORT = "8080"
SESSION_COOKIE_SECURE = "true"

[services.production.health.startup]
path = "/api/healthz"
